name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          mkdir work
          unzip -q cctiers-source.zip -d work
          SRC=$(dirname "$(find work -maxdepth 2 -name build.gradle | head -1)")
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: cd "$SRC" && gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cctiers
          path: ${{ env.SRC }}/build/libs/cctiers-*.jar
